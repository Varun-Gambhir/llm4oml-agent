# File: config/default.yaml
# ============================================================================
# Default configuration for Convergence Proof Agent v2.0

models:
  prover:
    name: "openai/gpt-oss-120b"
    temperature: 0.5
    max_tokens: 8192
  
  evaluators:
    use_multi_judge: true
    models:
      - "openai/gpt-oss-120b"
      - "meta/llama-3.1-70b-instruct"
    temperature: 0.5
    max_tokens: 8192

workflow:
  max_iterations: 3
  min_crs_threshold: 0.7  # Minimum CRS to consider "good" correction

metrics:
  correction:
    # Weights for CRS computation
    weight_err: 0.5    # Error Resolution Rate
    weight_rp: 0.3     # Regression Penalty
    weight_tfp: 0.2    # Targeted Fix Precision
  
  judge_reliability:
    # Weights for JRS computation
    alpha: 0.6         # Weight for ESA (agreement)
    beta: 0.4          # Weight for z-score penalty
    outlier_threshold: 2.0  # Z-score threshold for outliers

logging:
  level: "INFO"
  log_dir: "logs"
  save_proofs: true
  save_intermediate_states: true

batch_processing:
  parallel_workers: 1  # Process one at a time for now
  checkpoint_frequency: 1  # Save after each algorithm

